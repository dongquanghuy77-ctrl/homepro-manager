name: Architect Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Run Tests (UAT)
        run: echo "Running Regression Tests (Mocked for CI)"

  architect-review:
    runs-on: ubuntu-latest
    needs: test-and-verify
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Check Decision Required
        id: check_req
        run: |
          DECISION_REQ=$(cat .architect/CURRENT_STATE.md | grep "DECISION_REQUIRED=" | cut -d'=' -f2)
          if [ "$DECISION_REQ" == "YES" ]; then
            echo "ARCHITECT_REVIEW_REQUIRED" > review_request.txt
            cat .architect/CURRENT_STATE.md >> review_request.txt
            echo "Review required!"
          else
            echo "No review required."
          fi

      - name: Upload Review Artifact
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: ARCHITECT_REVIEW_REQUIRED
          path: review_request.txt

  production-gate:
    runs-on: ubuntu-latest
    needs: test-and-verify
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Check Architect Approval
        id: check_approval
        run: |
          APPROVAL=$(cat .architect/DECISION.md | grep "DECISION=" | cut -d'=' -f2)
          echo "Current Approval: $APPROVAL"
          if [ "$APPROVAL" != "GO" ]; then
            echo "========================================"
            echo "PRODUCTION ACTION BLOCKED"
            echo "Architect approval required."
            echo "ARCHITECT_APPROVAL=$APPROVAL"
            echo "========================================"
            exit 1
          fi

      - name: Run Production Migration (Mock)
        if: success()
        run: echo "Executing Production Tasks..."
